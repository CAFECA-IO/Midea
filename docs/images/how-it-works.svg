<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Midea 運作原理" font-family="'PingFang TC','Noto Sans CJK TC','Microsoft JhengHei','Noto Sans TC',system-ui,sans-serif">
<title>Midea 運作原理</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ba6b8"/></marker><marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f2b84b"/></marker></defs>
<rect width="1200" height="700" rx="16" fill="#1d2330"/>
<text x="40" y="52" font-size="26" fill="#e9edf4" font-weight="700" text-anchor="start">運作原理</text>
<text x="40" y="78" font-size="14" fill="#9ba6b8" font-weight="400" text-anchor="start">導演程式依管線定義逐階段執行；每階段先存檔，遇到審核關卡就暫停等人決定；GPU 由排程器輪流分配</text>
<rect x="40" y="100" width="640" height="400" rx="14" fill="#222a39" stroke="#4a556b" stroke-width="1.2"/>
<text x="60" y="128" font-size="17" fill="#e9edf4" font-weight="600" text-anchor="start">① 階段機與審核關卡</text>
<rect x="70" y="170" width="170" height="62" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<rect x="70" y="180" width="3" height="42" rx="1.5" fill="#b7a6ff"/>
<text x="84" y="194" font-size="15" fill="#e9edf4" font-weight="600" text-anchor="start">執行階段</text>
<text x="84" y="214" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">呼叫模型與工具</text>
<rect x="290" y="170" width="170" height="62" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<rect x="290" y="180" width="3" height="42" rx="1.5" fill="#7fd1c2"/>
<text x="304" y="194" font-size="15" fill="#e9edf4" font-weight="600" text-anchor="start">存檔 checkpoint</text>
<text x="304" y="214" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">stages/&lt;階段&gt;.json</text>
<rect x="510" y="170" width="150" height="62" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<rect x="510" y="180" width="3" height="42" rx="1.5" fill="#b7a6ff"/>
<text x="524" y="194" font-size="15" fill="#e9edf4" font-weight="600" text-anchor="start">是關卡嗎？</text>
<text x="524" y="214" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">pipeline_defs/*.yaml</text>
<line x1="240" y1="201" x2="288" y2="201" stroke="#9ba6b8" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="460" y1="201" x2="508" y2="201" stroke="#9ba6b8" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 585 232 L 585 274" fill="none" stroke="#f2b84b" stroke-width="1.6" marker-end="url(#am)"/>
<text x="595" y="258" font-size="13" fill="#f2b84b" font-weight="600" text-anchor="start">是</text>
<path d="M 660 201 L 668 201 L 668 152 L 155 152 L 155 168" fill="none" stroke="#9ba6b8" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="420" y="146" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="middle">否 → 下一階段</text>
<rect x="470" y="276" width="190" height="62" rx="10" fill="#323b4e" stroke="#f2b84b" stroke-width="1.2"/>
<text x="565" y="302" font-size="15" fill="#f2b84b" font-weight="700" text-anchor="middle">◆ 等待審核</text>
<text x="565" y="322" font-size="12" fill="#9ba6b8" font-weight="400" text-anchor="middle">看板即時顯示內容與花費</text>
<rect x="70" y="384" width="190" height="62" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<rect x="70" y="394" width="3" height="42" rx="1.5" fill="#7fd1c2"/>
<text x="84" y="408" font-size="15" fill="#e9edf4" font-weight="600" text-anchor="start">核准</text>
<text x="84" y="428" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">寫入存檔 → 下一階段</text>
<rect x="270" y="384" width="190" height="62" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<rect x="270" y="394" width="3" height="42" rx="1.5" fill="#f2b84b"/>
<text x="284" y="408" font-size="15" fill="#e9edf4" font-weight="600" text-anchor="start">退回＋意見</text>
<text x="284" y="428" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">整段重做（最多 3 次）</text>
<rect x="470" y="384" width="190" height="62" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<rect x="470" y="394" width="3" height="42" rx="1.5" fill="#b7a6ff"/>
<text x="484" y="408" font-size="15" fill="#e9edf4" font-weight="600" text-anchor="start">指定重做</text>
<text x="484" y="428" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">只重畫／重生勾選的鏡頭</text>
<path d="M 565 338 L 565 360 L 165 360 L 165 382" fill="none" stroke="#9ba6b8" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="365" y1="360" x2="365" y2="382" stroke="#9ba6b8" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="565" y1="360" x2="565" y2="382" stroke="#9ba6b8" stroke-width="1.6" marker-end="url(#a)"/>
<text x="60" y="472" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">· 看板或伺服器重啟：從最後一個存檔接續；重啟前送出的關卡決定仍會被採用一次。</text>
<text x="60" y="491" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">· 自動模式（auto_approve）跳過關卡；花費低於門檻的分鏡也會自動核准。</text>
<rect x="700" y="100" width="460" height="400" rx="14" fill="#222a39" stroke="#4a556b" stroke-width="1.2"/>
<text x="720" y="128" font-size="17" fill="#e9edf4" font-weight="600" text-anchor="start">② 單卡 GPU 排程（48 GB）</text>
<rect x="740" y="160" width="390" height="230" rx="6" fill="#161b25" stroke="#4a556b" stroke-width="1.2"/>
<text x="732" y="168" font-size="11" fill="#9ba6b8" font-weight="400" text-anchor="end">48</text>
<text x="732" y="390" font-size="11" fill="#9ba6b8" font-weight="400" text-anchor="end">0 GB</text>
<rect x="746" y="260.625" width="114" height="129.375" rx="4" fill="#b7a6ff" opacity=".85"/><text x="803.0" y="329.3125" font-size="12" fill="#1d2330" font-weight="700" text-anchor="middle">Qwen 27 GB</text>
<rect x="746" y="231.875" width="114" height="26.354166666666668" rx="4" fill="#7fd1c2" opacity=".85"/><text x="803.0" y="249.05208333333334" font-size="12" fill="#1d2330" font-weight="700" text-anchor="middle">VoxCPM2</text>
<rect x="872" y="179.16666666666666" width="158" height="210.83333333333334" rx="4" fill="#f2b84b" opacity=".85"/><text x="951.0" y="288.5833333333333" font-size="12" fill="#1d2330" font-weight="700" text-anchor="middle">H3 獨佔</text>
<rect x="1042" y="361.25" width="82" height="28.75" rx="4" fill="#7fd1c2" opacity=".85"/><text x="1083.0" y="379.625" font-size="12" fill="#1d2330" font-weight="700" text-anchor="middle">ACE-Step</text>
<text x="803" y="410" font-size="12" fill="#9ba6b8" font-weight="400" text-anchor="middle">企劃、旁白</text>
<text x="951" y="410" font-size="12" fill="#9ba6b8" font-weight="400" text-anchor="middle">生成鏡頭</text>
<text x="1083" y="410" font-size="12" fill="#9ba6b8" font-weight="400" text-anchor="middle">配樂</text>
<text x="720" y="432" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">· 需要整張卡的 H3 來時，先停掉其他服務釋放顯存。</text>
<text x="720" y="452" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">· 卡被占用時租約排隊等待，不會直接失敗。</text>
<text x="720" y="472" font-size="12.5" fill="#9ba6b8" font-weight="400" text-anchor="start">· 服務閒置 600 秒自動停止，整棵行程樹一併結束。</text>
<rect x="40" y="520" width="1120" height="156" rx="14" fill="#222a39" stroke="#4a556b" stroke-width="1.2"/>
<text x="60" y="548" font-size="17" fill="#e9edf4" font-weight="600" text-anchor="start">③ 自我審核：沒通過就不發佈</text>
<rect x="60.0" y="566" width="171.66666666666666" height="60" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<text x="145.83333333333331" y="590" font-size="14" fill="#e9edf4" font-weight="600" text-anchor="middle">容器規格</text>
<text x="145.83333333333331" y="610" font-size="11.5" fill="#9ba6b8" font-weight="400" text-anchor="middle">H.264／AAC、解析度、漂移</text>
<rect x="241.66666666666666" y="566" width="171.66666666666666" height="60" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<text x="327.5" y="590" font-size="14" fill="#e9edf4" font-weight="600" text-anchor="middle">片長與比例</text>
<text x="327.5" y="610" font-size="11.5" fill="#9ba6b8" font-weight="400" text-anchor="middle">符合承諾；廣告 ±0.3 秒</text>
<rect x="423.3333333333333" y="566" width="171.66666666666666" height="60" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<text x="509.16666666666663" y="590" font-size="14" fill="#e9edf4" font-weight="600" text-anchor="middle">畫面</text>
<text x="509.16666666666663" y="610" font-size="11.5" fill="#9ba6b8" font-weight="400" text-anchor="middle">全黑、過曝、凍結、幻燈片</text>
<rect x="605.0" y="566" width="171.66666666666666" height="60" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<text x="690.8333333333334" y="590" font-size="14" fill="#e9edf4" font-weight="600" text-anchor="middle">聲音</text>
<text x="690.8333333333334" y="610" font-size="11.5" fill="#9ba6b8" font-weight="400" text-anchor="middle">−14 LUFS、真峰值、削波、靜音</text>
<rect x="786.6666666666666" y="566" width="171.66666666666666" height="60" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<text x="872.5" y="590" font-size="14" fill="#e9edf4" font-weight="600" text-anchor="middle">字幕</text>
<text x="872.5" y="610" font-size="11.5" fill="#9ba6b8" font-weight="400" text-anchor="middle">閱讀速度、覆蓋率、ASR 同步</text>
<rect x="968.3333333333333" y="566" width="171.66666666666666" height="60" rx="10" fill="#272f3f" stroke="#4a556b" stroke-width="1.2"/>
<text x="1054.1666666666665" y="590" font-size="14" fill="#e9edf4" font-weight="600" text-anchor="middle">廣告專屬</text>
<text x="1054.1666666666665" y="610" font-size="11.5" fill="#9ba6b8" font-weight="400" text-anchor="middle">商品時長、字卡、宣稱檢查</text>
<text x="60" y="656" font-size="13" fill="#9ba6b8" font-weight="400" text-anchor="start">不合格時自動修正可修的項目（兩段式 loudnorm、影音漂移重新封裝），再重新檢查；通過後才進入「發佈」關卡並寫入 final/。</text>
</svg>

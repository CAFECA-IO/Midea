<!doctype html><html><head><meta charset="utf-8"></head><body><script>
/*LIB*/
// Ad end card / pack shot: product cut-out, headline, CTA pill, brand logo and URL in the concept palette.
// Landscape: product left, copy right. Portrait / square: product on top, copy below.
P.no_ambient = true;
const svg = stage();
const land = W / H > 1.2;
const pw = land ? W * .42 : W * .78, ph = land ? H * .72 : H * (W / H < .7 ? .42 : .46);
const px = land ? W * .06 : (W - pw) / 2, py = land ? (H - ph) / 2 : H * .08;
const cx = land ? W * .70 : W / 2;
const ty = land ? H * .40 : py + ph + H * (W / H < .7 ? .07 : .06);
const glow = el("ellipse", { cx: px + pw / 2, cy: py + ph * .92, rx: pw * .38, ry: ph * .05, fill: "#000", opacity: .25 }, svg);
const prod = P.product_img ? el("image", { href: P.product_img, x: px, y: py, width: pw, height: ph,
                                            preserveAspectRatio: "xMidYMid meet" }, svg) : null;
const maxW = land ? W * .44 : W * .86;
const K = W / H < .7 ? 1.3 : 1;  // vertical: larger type (viewed on phones)
function fit(t, size) {        // shrink long lines to the available width
  size *= K;
  const n = [...String(t || "")].reduce((a, c) => a + (c.charCodeAt(0) > 0x2e80 ? 1 : .55), 0);
  return Math.min(size, maxW / Math.max(1, n) / U);
}
const brand = text(svg, P.brand || "", cx, land ? H * .24 : ty - H * .02, fit(P.brand, 30), { fill: C.muted, "font-weight": 500, "letter-spacing": 3 * U });
const head = text(svg, P.headline || "", cx, land ? H * .40 : ty + H * .045, fit(P.headline, land ? 72 : 64));
const sub = text(svg, P.sub || "", cx, land ? H * .50 : ty + H * .10, fit(P.sub, 32), { fill: C.muted, "font-weight": 400 });
const bw = Math.min(maxW, (fit(P.cta, 34) * U) * [...String(P.cta || "Shop now")].length * .62 + 90 * U), bh = 78 * U;
const by = land ? H * .60 : ty + H * .155;
const btn = el("rect", { width: bw, height: bh, x: cx - bw / 2, y: by, rx: bh / 2, fill: C.accent }, svg);
const bt = text(svg, P.cta || "Shop now", cx, by + bh / 2, fit(P.cta, 34), { fill: C.bg });
const url = text(svg, P.url || "", cx, by + bh + 46 * U, fit(P.url, 24), { fill: C.muted, "font-weight": 400 });
const logo = P.logo_img ? el("image", { href: P.logo_img, x: W - 150 * U, y: 40 * U, width: 110 * U, height: 110 * U,
                                         preserveAspectRatio: "xMidYMid meet" }, svg) : null;
window.render = (t, total) => {
  const o = outro(t, total, .35);
  const kp = ease.outCubic(prog(t, 0, .8));
  if (prod) { prod.setAttribute("opacity", kp * o);
    const s = .92 + .08 * kp + .02 * (t / total);           // settle, then a slow push-in
    prod.setAttribute("transform", `translate(${px + pw / 2} ${py + ph / 2}) scale(${s}) translate(${-(px + pw / 2)} ${-(py + ph / 2)})`); }
  glow.setAttribute("opacity", .25 * kp * o);
  [brand, head, sub].forEach((e, i) => { const k = ease.outCubic(prog(t, .25 + i * .18, .6));
    e.setAttribute("opacity", k * o); e.setAttribute("transform", `translate(0 ${(1 - k) * 24 * U})`); });
  const kb = ease.outBack(prog(t, .9, .55));
  btn.setAttribute("transform", `translate(${cx} ${by + bh / 2}) scale(${Math.max(.001, kb)}) translate(${-cx} ${-(by + bh / 2)})`);
  btn.setAttribute("opacity", o); bt.setAttribute("opacity", clamp(kb) * o);
  url.setAttribute("opacity", ease.outCubic(prog(t, 1.2, .5)) * o);
  if (logo) logo.setAttribute("opacity", ease.outCubic(prog(t, .4, .6)) * o);
};
ready();
</script></body></html>

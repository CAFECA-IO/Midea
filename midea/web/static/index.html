<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midea Studio</title>
<style>
:root{--bg:#1a1e29;--panel:#20253331;--panel:#212636;--panel2:#272d3f;--line:#343a4d;--fg:#eef0f6;--muted:#7d849a;--accent:#f5a524;--accent2:#8b90c8;--ok:#3fb984;--warn:#f5a524;--bad:#e5534b;--r:4px}
:root{color-scheme:dark}a{color:var(--accent);text-decoration:none}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#1a1e29;font-weight:600}
button.danger{border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh}
aside{border-right:1px solid var(--line);overflow:auto;padding:16px;background:var(--panel)}
main{overflow:auto;padding:20px 24px 80px}
h1{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px}h1 small{color:var(--muted);font-weight:400;font-size:12px}
h2{font-size:14px;font-weight:500;margin:22px 0 10px;display:flex;align-items:center;gap:8px}h2::before{content:'';width:3px;height:13px;background:var(--accent);display:inline-block}h3{font-size:12px;margin:0 0 8px;color:var(--fg);font-weight:500;letter-spacing:.04em;display:flex;align-items:center;gap:8px}h3::before{content:'';width:3px;height:12px;background:var(--accent);display:inline-block}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.chk{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--fg);font-size:13px}.chk input{width:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.plist{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.pitem{padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer}.pitem:hover{background:var(--panel2)}.pitem.on{border-color:var(--accent);background:var(--panel2)}
.pitem .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pitem .m{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:2px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.b-pass,.b-done,.b-approved{color:var(--ok);border-color:var(--ok)}.b-warn,.b-awaiting,.b-awaiting_approval,.b-review{color:var(--warn);border-color:var(--warn)}
.b-fail,.b-failed,.b-rejected,.b-qa_failed{color:var(--bad);border-color:var(--bad)}.b-running{color:var(--accent);border-color:var(--accent)}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.stage{padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.stage{border-radius:2px;background:var(--panel)}.stage.done{color:var(--fg);border-color:var(--accent2);background:#8b90c822}.stage.cur{color:#1a1e29;background:var(--accent);border-color:var(--accent)}.stage.gate::after{content:" ◆";color:var(--warn)}
.gatebar{position:sticky;top:0;z-index:5;background:#2a2a2a;background:linear-gradient(90deg,#3b3020,#262b3a);border:1px solid #f5a52466;border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.gatebar .row{flex-wrap:wrap}.gatebar textarea{min-height:38px;height:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.scene .media{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.scene{border-radius:4px}.scene .media img,.scene .media video{width:100%;height:100%;object-fit:contain}
.scene .media .k{position:absolute;left:8px;top:8px}.scene .media .d{position:absolute;right:8px;top:8px}
.scene .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.scene .nar{font-size:13px}.scene .vis{font-size:12px;color:var(--muted);word-break:break-word}
.scene.sel{outline:2px solid var(--warn)}.scene textarea{font-size:12px;min-height:54px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}
.cost{display:flex;gap:22px;flex-wrap:nowrap;align-items:center}.cost .n{font-size:26px;font-weight:300;letter-spacing:.02em}.cost .n .amber{color:var(--accent)}.cost .l{color:var(--muted);font-size:12px}
.log{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);max-height:220px;overflow:auto;background:var(--bg);border-radius:8px;padding:8px;border:1px solid var(--line)}
.vram{height:6px;background:var(--line);overflow:hidden}.vram i{display:block;height:100%;background:var(--accent)}
.svc{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--muted)}.svc b{color:var(--fg);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#444;margin-right:6px}.dot.on{background:var(--ok)}
pre.json{white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--line);max-height:420px;overflow:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 12px}.tab{padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}.tab.on{color:var(--fg);border-color:var(--accent)}.ring{display:flex;align-items:center;gap:10px}.ring svg{flex:0 0 auto}
.empty{color:var(--muted);text-align:center;padding:80px 20px}
.alts{display:flex;gap:4px;flex-wrap:wrap}.alts button{font-size:11px;padding:2px 6px}
.nav{display:flex;gap:4px;margin:-4px 0 12px}.nav button{flex:1;border-radius:2px}.nav button.on{border-color:var(--accent);color:var(--accent)}
.ac-wrap{position:relative}.ac-menu{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel2);border:1px solid var(--line);border-radius:6px;margin-top:2px;max-height:240px;overflow:auto;box-shadow:0 8px 24px #0008}
.ac-item{display:flex;gap:8px;align-items:center;padding:6px 8px;cursor:pointer;font-size:13px}.ac-item.on,.ac-item:hover{background:#f5a52422}.ac-item small{color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--line);flex:0 0 auto;display:inline-block}.av.lg{width:40px;height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 2px;border:1px solid var(--line);border-radius:99px;font-size:12px;background:var(--panel2);cursor:pointer}.chip:hover{border-color:var(--accent)}.chip .av{width:22px;height:22px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}.acard:hover{border-color:var(--accent)}
.acard .ph{aspect-ratio:3/4;background:#11141c center/cover no-repeat;position:relative}.acard .ph .badge{position:absolute;left:8px;top:8px;background:#1a1e29cc}
.acard .bd{padding:10px 12px}.acard .nm{font-size:15px}.acard .hd{color:var(--accent);font-size:12px}.acard .mt{color:var(--muted);font-size:12px}
.acard.new{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);min-height:280px;font-size:14px}
.profile{display:grid;grid-template-columns:300px 1fr;gap:20px}.profile .hero{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);background:#11141c;border:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.gallery .g{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gallery .g.on{border-color:var(--accent)}.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#11141c}.gallery .g .row{padding:6px 8px;font-size:12px;gap:4px}
.gallery .g button{font-size:11px;padding:2px 6px}
.films{display:flex;flex-direction:column;gap:10px}.film{display:grid;grid-template-columns:200px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer}.film:hover{border-color:var(--accent)}
.film img.t{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:#000}.film .sc{display:flex;gap:4px;margin-top:6px;overflow:auto}.film .sc img{height:44px;border-radius:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fgrid .full{grid-column:1/-1}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px}@keyframes sp{to{transform:rotate(360deg)}}
.consent{border:1px solid #f5a52466;background:#f5a52411;border-radius:var(--r);padding:10px 12px;margin-top:12px}
.scene .cast{position:absolute;left:8px;bottom:8px;display:flex;gap:-4px}.scene .cast .av{width:26px;height:26px;border:2px solid #1a1e29;margin-right:-6px}
@media (max-width:900px){.profile{grid-template-columns:1fr}.film{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}}
@media (max-width:900px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);max-height:none}}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Midea Studio <small id="mode"></small></h1>
  <div class="nav"><button id="nav-films" class="on" onclick="goFilms()">影片製作</button><button id="nav-actors" onclick="goActors()">演員陣容 <span id="actor-count" style="color:var(--muted)"></span></button></div>
  <div class="card">
    <h3>新影片</h3>
    <label>一句話描述</label>
    <div class="ac-wrap"><textarea id="f-prompt" rows="3" placeholder="製作一支 60 秒解釋神經網路的動畫；輸入 @ 指定演員"></textarea><div class="ac-menu" id="ac-menu" hidden></div></div>
    <div class="chips" id="f-cast"></div>
    <div class="row">
      <div><label>製作管線</label><select id="f-pipe"><option value="auto">自動判斷</option></select></div>
      <div style="flex:.6"><label>秒數</label><input id="f-dur" type="number" value="60" min="5" max="600"></div>
    </div>
    <div class="row">
      <div><label>畫面比例</label><select id="f-aspect"><option value="">依管線</option><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></div>
      <div><label>語言</label><select id="f-lang"><option value="zh-TW">繁中</option><option value="zh-CN">简中</option><option value="en">English</option><option value="ja">日本語</option></select></div>
    </div>
    <label>參考影片（Shorts / Reels / TikTok）</label>
    <input id="f-ref" placeholder="https://youtube.com/shorts/…">
    <label>旁白聲音（VoxCPM2 聲音設計描述）</label>
    <input id="f-voice" placeholder="(warm, clear documentary narrator)">
    <label>自有素材（長片、配音來源、產品參考圖）</label>
    <input id="f-media" type="file" multiple>
    <label class="chk"><input type="checkbox" id="f-real"> 僅使用真實素材（Archive.org / NASA / Wikimedia / Pexels）</label>
    <label class="chk"><input type="checkbox" id="f-music" checked> 背景音樂（ACE-Step）</label>
    <label class="chk"><input type="checkbox" id="f-subs" checked> 字幕壓製</label>
    <label class="chk"><input type="checkbox" id="f-auto"> 自動通過所有關卡（不建議）</label>
    <div style="margin-top:12px"><button class="primary" id="f-go" style="width:100%">開始製作</button></div>
  </div>
  <div class="card" style="margin-top:12px">
    <h3>GPU</h3>
    <div id="gpu"></div>
  </div>
  <div class="plist" id="plist"></div>
</aside>
<main id="main"><div class="empty">選擇左側專案，或輸入一句話開始製作。<br><br><span id="toolcount"></span></div></main>
</div>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api = async (u, o = {}) => { const r = await fetch(u, { headers: { "Content-Type": "application/json" }, ...o }); if (!r.ok) throw new Error(await r.text()); return r.json(); };
let META = {}, CUR = null, DATA = null, ES = null, TAB = "board", SEL = new Set(), REGEN = {};
let ACTORS = [], VIEW = "films", ACTOR = null, ACTOR_POLL = null, DRAFT = null, AC_IDX = 0;
const actorUrl = (id, p) => p ? `/actor-files/${id}/${p}`.replace(/#/g, "%23") : "";
const GENDER_ZH = { female: "女", male: "男", nonbinary: "非二元" };
const STATUS_ZH = { done: "完成", running: "製作中", awaiting_approval: "待核准", failed: "失敗", qa_failed: "QA 未過", created: "建立" };
const STAGE_ZH = { reference_analysis: "參考分析", proposal: "企劃", script: "腳本", scene_plan: "分鏡", voice: "旁白", assets: "素材生成", music_sfx: "音樂音效", edit: "剪輯", compose: "合成字幕", qa: "自我審核", publish: "發佈", ingest: "匯入", transcribe: "轉錄", highlights: "高光", translate: "翻譯" };
const KIND_ZH = { h3_t2v: "H3 生成", h3_i2v: "H3 圖生影", h3_r2v: "H3 參考", stock_video: "真實影片", stock_image: "真實照片", motion: "動態圖形", title_card: "標題卡", user_media: "自有素材" };
const fileUrl = p => `/files/${CUR}/${p}`.replace(/#/g, "%23");

async function init() {
  META = await api("/api/meta");
  $("#mode").textContent = META.mode === "mock" ? "MOCK（無 GPU 示範）" : "LOCAL GPU";
  $("#toolcount").textContent = `${Object.keys(META.pipelines).length} 條製作管線 · ${META.tools} 種工具`;
  for (const [k, p] of Object.entries(META.pipelines)) $("#f-pipe").insertAdjacentHTML("beforeend", `<option value="${k}">${esc(p.title)}</option>`);
  $("#f-go").onclick = create;
  initMention();
  refreshList(); refreshGpu(); refreshActors(); setInterval(refreshGpu, 5000); setInterval(refreshList, 8000);
  const h = location.hash.slice(1);
  if (h === "actors") goActors(); else if (h.startsWith("actor/")) openActor(h.slice(6)); else if (h) open(h);
  window.addEventListener("hashchange", () => {
    const k = location.hash.slice(1);
    if (k === "actors" && VIEW !== "actors") goActors();
    else if (k.startsWith("actor/") && ACTOR?.id !== k.slice(6)) openActor(k.slice(6));
    else if (k && !k.startsWith("actor") && (k !== CUR || VIEW !== "films")) open(k);
  });
}
async function refreshList() {
  const ps = await api("/api/projects");
  $("#plist").innerHTML = ps.map(p => `<div class="pitem ${p.id === CUR ? "on" : ""}" onclick="open('${p.id}')"><div class="t">${esc(p.title || p.id)}</div>
    <div class="m"><span class="badge b-${p.status}">${p.status}</span> ${esc(META.pipelines[p.pipeline]?.title || p.pipeline)} · ${esc(STAGE_ZH[p.stage] || p.stage || "")}</div></div>`).join("");
}
async function refreshGpu() {
  try {
    const g = await api("/api/gpu"); const pct = Math.min(100, g.resident_gb / g.budget_gb * 100);
    const dev = g.gpus[0] ? `${esc(g.gpus[0].name)} · ${(g.gpus[0].used_mb / 1024).toFixed(1)}/${(g.gpus[0].total_mb / 1024).toFixed(0)} GB · ${g.gpus[0].util}%` : "未偵測到 nvidia-smi";
    $("#gpu").innerHTML = `<div class="svc"><span>${dev}</span></div><div class="vram"><i style="width:${pct}%"></i></div>
      <div class="svc"><span>Midea 配置 ${g.resident_gb.toFixed(1)} / ${g.budget_gb.toFixed(1)} GB</span></div>` +
      (g.foreign_gb ? `<div class="svc" title="${esc((g.foreign || []).map(a => a.pid + " " + a.name).join(", "))}"><span style="color:var(--bad)">其他程式占用 ${g.foreign_gb} GB</span></div>` : "") +
      Object.entries(g.services).map(([n, s]) => `<div class="svc"><span><span class="dot ${s.running ? "on" : ""}"></span><b>${n}</b> ${esc(s.model || "")}</span>
      <span>${s.vram_gb}GB${s.exclusive ? " ⓧ" : ""} <a href="#" onclick="svc('${n}','${s.running ? "stop" : "start"}');return false">${s.running ? "停止" : "啟動"}</a></span></div>`).join("");
  } catch (e) {}
}
async function svc(n, a) { await api(`/api/services/${n}/${a}`, { method: "POST" }); refreshGpu(); }
async function create() {
  const prompt = $("#f-prompt").value.trim(); if (!prompt) return $("#f-prompt").focus();
  $("#f-go").disabled = true;
  try {
    const media = [];
    for (const f of $("#f-media").files) { const fd = new FormData(); fd.append("file", f); media.push((await (await fetch("/api/upload", { method: "POST", body: fd })).json()).path); }
    const body = { prompt, pipeline: $("#f-pipe").value, duration_s: +$("#f-dur").value, aspect: $("#f-aspect").value || null, language: $("#f-lang").value,
      real_only: $("#f-real").checked, reference_url: $("#f-ref").value.trim() || null, user_media: media, voice: $("#f-voice").value.trim() || null,
      music: $("#f-music").checked, subtitles: $("#f-subs").checked, auto_approve: $("#f-auto").checked,
      actors: castIn(prompt).map(a => a.id) };
    const r = await api("/api/projects", { method: "POST", body: JSON.stringify(body) });
    await refreshList(); open(r.id);
  } catch (e) { alert(e.message); } finally { $("#f-go").disabled = false; }
}
async function open(id) {
  setView("films"); clearInterval(ACTOR_POLL);
  if (CUR !== id) { SEL.clear(); REGEN = {}; }
  CUR = id; location.hash = id; refreshList();
  if (ES) ES.close();
  ES = new EventSource(`/api/events/${id}`);
  let t = null; ES.onmessage = ev => { const e = JSON.parse(ev.data); clearTimeout(t); t = setTimeout(load, e.kind === "progress" ? 600 : 150); };
  load();
}
async function load() { if (!CUR) return; DATA = await api(`/api/projects/${CUR}`); render(); }

function ring(v, max, label, sub, color) {
  const R = 22, C = 2 * Math.PI * R, sw = .78, f = Math.max(0, Math.min(1, max ? v / max : 0)) * sw, rot = 90 + (1 - sw) * 180;
  return `<div class="ring"><svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="${R}" fill="none" stroke="#343a4d" stroke-width="3" stroke-dasharray="${C * sw} ${C}" stroke-linecap="round" transform="rotate(${rot} 28 28)"/>
    <circle cx="28" cy="28" r="${R}" fill="none" stroke="${color || "var(--accent)"}" stroke-width="3" stroke-dasharray="${C * f} ${C}" stroke-linecap="round" transform="rotate(${rot} 28 28)"/>
    <text x="28" y="32" text-anchor="middle" fill="#eef0f6" font-size="12" font-weight="300">${Math.round(max ? v / max * 100 : 0)}%</text></svg>
    <div><div class="n">${label}</div><div class="l">${sub}</div></div></div>`;
}
function render() {
  const d = DATA, cur = META.currency || "";
  const awaiting = Object.entries(d.gates || {}).find(([, g]) => g.status === "awaiting");
  const est = d.data.scene_plan?._estimate;
  const stages = d.stages_order.map(s => { const st = d.stages[s]?.status; const cls = st === "done" ? "done" : (d.stage === s ? "cur" : "");
    return `<span class="stage ${cls} ${d.gates_order.includes(s) ? "gate" : ""}">${STAGE_ZH[s] || s}</span>`; }).join("");
  let h = `<div class="row" style="align-items:flex-start"><div style="flex:3"><h1 style="margin:0">${esc(d.data.proposal?.title || d.brief.prompt)}</h1>
    <div class="m" style="color:var(--muted)">${esc(META.pipelines[d.pipeline]?.title || d.pipeline)} · ${esc(d.id)} · <span class="badge b-${d.status}">${d.status}</span>
    ${d.running ? "" : (["done"].includes(d.status) ? "" : `<button onclick="resume()" style="margin-left:8px">繼續執行</button>`)}</div></div>
    <div class="cost" style="flex:2;justify-content:flex-end">${ring(d.cost.estimated || 0, META.budget?.total_cap || 1, (d.cost.estimated || 0).toFixed(2), `預估 ${cur} / 上限 ${META.budget?.total_cap ?? "—"}`)}
    ${ring(d.cost.actual || 0, d.cost.estimated || 1, `<span class="amber">${(d.cost.actual || 0).toFixed(2)}</span>`, `實際 ${cur}`, "#8b90c8")}

    ${F("x-vo-description", "VoxCPM2 聲音設計（英文）", vo.description, { ph: "warm low voice, calm pace, slight rasp" })}${F("x-vo-description_zh", "聲音描述（中文）", vo.description_zh)}
    ${F("x-vo-language", "主要語言", vo.language || "zh-TW", { opts: [["zh-TW", "繁中"], ["zh-CN", "简中"], ["en", "English"], ["ja", "日本語"]] })}
    ${F("x-vo-sample_text", "試音台詞（留空用預設）", vo.sample_text)}
  </div>`;
}
function readActorFields() {
  const g = id => $("#" + id)?.value ?? "", out = { appearance: {}, voice: {} };
  document.querySelectorAll("[id^='x-']").forEach(el => {
    const k = el.id.slice(2);
    if (k.startsWith("ap-")) out.appearance[k.slice(3)] = el.value; else if (k.startsWith("vo-")) out.voice[k.slice(3)] = el.value; else out[k] = el.value;
  });
  out.age = +g("x-age") || 30; out.appearance.height_cm = +out.appearance.height_cm || null;
  out.tags = g("x-tags").split(/[,，、]/).map(t => t.trim()).filter(Boolean);
  return out;
}
function consentBlock(prefix) {
  return `<div class="consent"><b>真人肖像 / 聲音</b> <span style="color:var(--muted);font-size:12px">預設以 AI 生成全新虛擬人物。若要以真實人物的照片或聲音為基礎，必須取得本人授權。</span>
    <div class="fgrid" style="margin-top:6px"><div><label>上傳照片（正面清晰）</label><input type="file" id="${prefix}-photo" accept="image/*"></div>
    <div><label>上傳聲音樣本（5–20 秒、無背景音）</label><input type="file" id="${prefix}-voice" accept="audio/*"></div>
    ${F(prefix + "-note", "授權來源 / 文件編號", "", { full: 1, ph: "例：2026-11 肖像與聲音授權書，簽署人 王小明" })}</div>
    <label class="chk"><input type="checkbox" id="${prefix}-consent"> 我確認已取得此人書面授權，可將其肖像與聲音用於 AI 生成，並為使用結果負責</label></div>`;
}
function renderActorForm() {
  const a = DRAFT || {};
  $("#a-form").innerHTML = `<div class="card" style="margin-top:12px">${actorFields(a)}${consentBlock("c")}
    <div class="row" style="margin-top:14px;justify-content:flex-end"><label class="chk" style="flex:0 0 auto;margin:0 12px 0 0"><input type="checkbox" id="c-gen" checked> 建立後立即生成定妝照與聲音（約 2–4 分鐘 GPU）</label>
    <button class="primary" style="flex:0 0 auto" id="c-save" onclick="saveNewActor()">建立演員</button></div></div>`;
}
async function uploadActorFiles(id, prefix) {
  const photo = $(`#${prefix}-photo`)?.files[0], voice = $(`#${prefix}-voice`)?.files[0];
  if (!photo && !voice) return null;
  if (!$(`#${prefix}-consent`).checked) throw new Error("上傳真人照片或聲音前，請先勾選授權聲明");
  let last = null;
  for (const [kind, f] of [["portrait", photo], ["voice", voice]]) {
    if (!f) continue;
    const fd = new FormData(); fd.append("kind", kind); fd.append("consent", "true"); fd.append("note", $(`#${prefix}-note`).value); fd.append("file", f);
    const r = await fetch(`/api/actors/${id}/upload`, { method: "POST", body: fd }); if (!r.ok) throw new Error(await r.text()); last = await r.json();
  }
  return last;
}
async function saveNewActor() {
  const body = readActorFields(), hasUpload = $("#c-photo").files[0] || $("#c-voice").files[0];
  if (hasUpload && !$("#c-consent").checked) return alert("上傳真人照片或聲音前，請先勾選授權聲明");
  body.generate = false;
  $("#c-save").disabled = true;
  try {
    const a = await api("/api/actors", { method: "POST", body: JSON.stringify(body) });
    await uploadActorFiles(a.id, "c");
    if ($("#c-gen").checked) {
      if (!$("#c-photo").files[0]) await api(`/api/actors/${a.id}/portraits`, { method: "POST", body: "{}" });
      if (!$("#c-voice").files[0]) await api(`/api/actors/${a.id}/voice`, { method: "POST", body: "{}" });
    }
    await refreshActors(); openActor(a.id);
  } catch (e) { alert(e.message); $("#c-save").disabled = false; }
}

// ---- profile
async function openActor(id) {
  setView("actor"); if (ES) { ES.close(); ES = null; } clearTimeout(ACTOR_POLL); location.hash = "actor/" + id;
  try { ACTOR = await api(`/api/actors/${id}`); } catch (e) { return goActors(); }
  renderActor();
  const busy = Object.values(ACTOR.jobs || {}).some(j => ["running", "queued"].includes(j.status));
  if (busy) ACTOR_POLL = setTimeout(() => VIEW === "actor" && ACTOR?.id === id && !$("#e-form") && openActor(id), 2500);
}
function job(name) {
  const j = (ACTOR.jobs || {})[name]; if (!j) return "";
  if (j.status === "running") return `<span class="badge b-running"><span class="spin"></span> 生成中${j.views ? ` ${j.done || 0}/${j.views.length}` : ""}</span>`;
  if (j.status === "queued") return `<span class="badge b-awaiting">排隊中</span>`;
  if (j.status === "error") return `<span class="badge b-fail" title="${esc(j.error)}">失敗：${esc((j.error || "").slice(0, 60))}</span>`;
  return "";
}
function renderActor() {
  const a = ACTOR, ap = a.appearance || {}, vo = a.voice || {}, by = Object.fromEntries((a.portraits || []).map(p => [p.view, p]));
  const hero = by[a.primary] || a.portraits?.[0], ts = p => p ? `?t=${Math.round(p.at || 0)}` : "";
  const films = a.films || [];
  $("#main").innerHTML = `<h1><a href="#" onclick="goActors();return false">演員陣容</a> <span style="color:var(--muted)">/</span> ${esc(a.name)}</h1>
  <div class="profile"><div>
    ${hero ? `<img class="hero" src="${actorUrl(a.id, hero.file)}${ts(hero)}">` : `<div class="hero" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">${job("portraits") || "尚無定妝照"}</div>`}
    <button class="primary" style="width:100%;margin-top:10px" onclick="castInNew('${esc(a.handle)}')">用 @${esc(a.handle)} 製作新影片</button>
    <div class="card" style="margin-top:10px"><h3>聲音 ${job("voice")}</h3>
      ${vo.sample ? `<audio src="${actorUrl(a.id, vo.sample)}?t=${Math.round((a.jobs?.voice?.at) || 0)}" controls style="width:100%"></audio>` : `<div style="color:var(--muted)">尚未建立</div>`}
      <div style="font-size:12px;color:var(--muted);margin-top:6px">${vo.source === "uploaded" ? "來源：真人授權錄音（複製）" : "來源：VoxCPM2 聲音設計"}<br>${esc(a.voice_prompt)}</div>
      ${vo.sample_text ? `<div style="font-size:12px;margin-top:6px">「${esc(vo.sample_text)}」</div>` : ""}
      <div class="row" style="margin-top:8px"><button onclick="genVoice()">${vo.sample ? "重新設計聲音" : "生成聲音"}</button></div></div>
    <div class="card" style="margin-top:10px"><div class="kv">
      <div>成本</div><div>${(a.cost?.actual || 0).toFixed(2)} ${META.currency || ""}</div>
      <div>授權</div><div>${a.consent?.real_person ? `真人授權 · ${esc((a.consent.scope || []).join("/"))}<br><span style="color:var(--muted);font-size:12px">${esc(a.consent.note || "")} ${a.consent.at ? new Date(a.consent.at * 1000).toLocaleDateString() : ""}</span>` : "純 AI 虛擬人物"}</div>
      <div>建立</div><div>${new Date(a.created * 1000).toLocaleDateString()}</div></div>
      <div class="row" style="margin-top:10px"><button onclick="editActor()">編輯資料</button><button class="danger" onclick="delActor()">刪除</button></div></div>
  </div><div>
    <div class="row" style="align-items:flex-end;justify-content:space-between"><div><div style="font-size:26px;font-weight:300">${esc(a.name)} <span style="font-size:15px;color:var(--muted)">${esc(a.name_en || "")}</span></div>
      <div style="color:var(--accent)">@${esc(a.handle)}</div></div></div>
    <div class="card" style="margin-top:10px"><div class="kv">
      <div>年齡 / 性別</div><div>${a.age} 歲 · ${GENDER_ZH[a.gender]}${ap.height_cm ? ` · ${ap.height_cm} cm` : ""}</div>
      <div>國籍 / 職業</div><div>${esc([a.nationality, a.occupation].filter(Boolean).join(" · ") || "—")}</div>
      <div>外貌</div><div>${esc([ap.build, ap.face, ap.hair, ap.eyes, ap.skin].filter(Boolean).join("；") || "—")}</div>
      <div>辨識特徵</div><div>${esc(ap.features || "—")}</div>
      <div>預設造型</div><div>${esc(a.wardrobe || a.wardrobe_en || "—")}</div>
      <div>個性</div><div>${esc(a.personality || "—")}</div>
      <div>表演風格</div><div>${esc(a.acting_notes || "—")}</div>
      <div>背景</div><div>${esc(a.bio || "—")}</div>
      ${(a.tags || []).length ? `<div>標籤</div><div>${a.tags.map(t => `<span class="badge">${esc(t)}</span>`).join(" ")}</div>` : ""}</div></div>
    <h2>定妝照 ${job("portraits")} <span style="flex:1"></span><button onclick="genPortraits(null,true)" style="font-size:12px">換一張臉（全部重生）</button></h2>
    <div class="gallery">${Object.entries(a.views).map(([v, zh]) => { const p = by[v];
      return `<div class="g ${a.primary === v ? "on" : ""}">${p ? `<img src="${actorUrl(a.id, p.file)}${ts(p)}" onclick="window.open(this.src)">` : `<div style="aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;color:var(--muted)">—</div>`}
        <div class="row" style="justify-content:space-between"><span>${zh}${p?.source === "uploaded" ? " · 上傳" : p?.source === "mock" ? " · mock" : ""}</span>
        <span style="flex:0 0 auto;display:flex;gap:4px">${p && a.primary !== v ? `<button onclick="setPrimary('${v}')">設為主照</button>` : a.primary === v ? `<span class="badge b-approved">主照</span>` : ""}<button onclick="genPortraits(['${v}'])">重生</button></span></div></div>`; }).join("")}</div>
    <div style="color:var(--muted);font-size:12px;margin-top:6px">主照與全身定裝會作為 MiniMax H3 參考圖，讓演員在每個鏡頭與每支影片中保持同一張臉與造型。</div>
    <details style="margin-top:10px"><summary style="cursor:pointer;color:var(--muted)">上傳真人照片 / 聲音（需授權）</summary>${consentBlock("u")}<div style="margin-top:8px"><button onclick="uploadMore()">上傳</button></div></details>
    <h2>演出作品 <span class="badge">${films.length}</span></h2>
    ${films.length ? `<div class="films">${films.map(f => `<div class="film" onclick="open('${f.project}')">
      ${f.thumb ? `<img class="t" src="/files/${f.project}/${f.thumb}">` : `<div class="t" style="aspect-ratio:16/9;background:#000;border-radius:3px"></div>`}
      <div><div style="font-size:15px">${esc(f.title)}</div>
        <div style="color:var(--muted);font-size:12px;margin:2px 0 4px"><span class="badge b-${f.status}">${STATUS_ZH[f.status] || f.status}</span> ${esc(META.pipelines[f.pipeline]?.title || f.pipeline)} · ${f.created ? new Date(f.created * 1000).toLocaleDateString() : ""} · <b style="color:var(--fg)">${f.role}</b> · ${f.scenes.filter(s => s.on_screen).length} 個鏡頭 · ${f.lines} 段台詞</div>
        <div style="font-size:12px;color:var(--muted)">${esc(f.prompt).slice(0, 120)}</div>
        <div class="sc">${f.scenes.filter(s => s.thumb).slice(0, 10).map(s => `<img src="/files/${f.project}/${s.thumb}" title="${esc(s.id)} ${esc(s.narration)}">`).join("")}</div></div></div>`).join("")}</div>`
      : `<div class="card" style="color:var(--muted)">還沒有演出作品。在影片描述中輸入 <b style="color:var(--accent)">@${esc(a.handle)}</b> 即可讓 ${esc(a.name)} 演出。</div>`}
  </div></div>`;
}
async function genPortraits(views, reseed = false) {
  if (reseed && !confirm("重新產生所有定妝照會換一張臉；已完成的影片不受影響，之後的新鏡頭會用新長相。繼續？")) return;
  await api(`/api/actors/${ACTOR.id}/portraits`, { method: "POST", body: JSON.stringify({ views, reseed }) }); setTimeout(() => openActor(ACTOR.id), 400);
}
async function genVoice() { await api(`/api/actors/${ACTOR.id}/voice`, { method: "POST", body: "{}" }); setTimeout(() => openActor(ACTOR.id), 400); }
async function setPrimary(v) { ACTOR = await api(`/api/actors/${ACTOR.id}/primary/${v}`, { method: "POST" }); renderActor(); refreshActors(); }
async function uploadMore() { try { const a = await uploadActorFiles(ACTOR.id, "u"); if (a) { openActor(ACTOR.id); refreshActors(); } } catch (e) { alert(e.message); } }
async function delActor() {
  if (!confirm(`刪除演員 ${ACTOR.name}？（已完成的影片不受影響，資料會移到 _actors/_trash）`)) return;
  await api(`/api/actors/${ACTOR.id}`, { method: "DELETE" }); await refreshActors(); goActors();
}
function editActor() {
  clearTimeout(ACTOR_POLL);
  $("#main").innerHTML = `<h1><a href="#" onclick="goActors();return false">演員陣容</a> <span style="color:var(--muted)">/</span> <a href="#" onclick="openActor('${ACTOR.id}');return false">${esc(ACTOR.name)}</a> / 編輯</h1>
    <div class="card" id="e-form">${actorFields(ACTOR)}<div class="row" style="margin-top:14px;justify-content:flex-end">
    <label class="chk" style="flex:0 0 auto;margin:0 12px 0 0"><input type="checkbox" id="e-regen"> 外貌已變更：重新生成定妝照</label>
    <button style="flex:0 0 auto" onclick="openActor('${ACTOR.id}')">取消</button><button class="primary" style="flex:0 0 auto" onclick="saveActor()">儲存</button></div></div>`;
}
async function saveActor() {
  try {
    await api(`/api/actors/${ACTOR.id}`, { method: "PUT", body: JSON.stringify(readActorFields()) });
    if ($("#e-regen").checked) await api(`/api/actors/${ACTOR.id}/portraits`, { method: "POST", body: "{}" });
    await refreshActors(); openActor(ACTOR.id);
  } catch (e) { alert(e.message); }
}
function castInNew(handle) {
  const ta = $("#f-prompt"); const t = ta.value.trim();
  ta.value = (t ? t + " " : "") + "@" + handle + " "; ta.focus(); renderCastChips();
}

// ---- @mention autocomplete in the brief
function castIn(text) {
  const out = [];
  for (const m of (text || "").matchAll(/@([\w㐀-鿿぀-ヿ가-힯.\-]+)/g)) {
    let tok = m[1].toLowerCase(), a = null;
    while (tok && !(a = ACTORS.find(x => [x.handle, x.name, x.name_en, x.id].some(k => (k || "").toLowerCase().replace(/\s+/g, "_") === tok)))) tok = tok.slice(0, -1);
    if (a && !out.includes(a)) out.push(a);
  }
  return out;
}
function renderCastChips() {
  const el = $("#f-cast"); if (!el) return;
  el.innerHTML = castIn($("#f-prompt").value).map(a => `<span class="chip" onclick="openActor('${a.id}')" title="開啟演員頁"><img class="av" src="${actorUrl(a.id, a.thumb)}">${esc(a.name)}</span>`).join("");
}
function initMention() {
  const ta = $("#f-prompt"), menu = $("#ac-menu");
  const token = () => { const m = ta.value.slice(0, ta.selectionStart).match(/@([^\s@]*)$/); return m ? m[1] : null; };
  const show = () => {
    const q = token(); if (q === null || !ACTORS.length) return (menu.hidden = true);
    const ql = q.toLowerCase(), score = a => [a.handle, a.name, a.name_en].reduce((m, k) => { const t = (k || "").toLowerCase();
      return Math.min(m, t.startsWith(ql) ? 0 : t.includes(ql) ? 1 : 9); }, 9);
    const list = ACTORS.filter(a => !ql || score(a) < 9).sort((x, y) => score(x) - score(y)).slice(0, 8);
    if (!list.length) return (menu.hidden = true);
    AC_IDX = Math.min(AC_IDX, list.length - 1);
    menu.innerHTML = list.map((a, i) => `<div class="ac-item ${i === AC_IDX ? "on" : ""}" data-h="${esc(a.handle)}"><img class="av" src="${actorUrl(a.id, a.thumb)}">
      <div><div>${esc(a.name)} <span style="color:var(--accent)">@${esc(a.handle)}</span></div><small>${a.age} 歲 · ${GENDER_ZH[a.gender]}${a.occupation ? " · " + esc(a.occupation) : ""}</small></div></div>`).join("");
    menu.hidden = false;
    menu.querySelectorAll(".ac-item").forEach(it => it.onmousedown = e => { e.preventDefault(); pick(it.dataset.h); });
  };
  const pick = h => {
    const pos = ta.selectionStart, before = ta.value.slice(0, pos).replace(/@([^\s@]*)$/, "@" + h + " ");
    ta.value = before + ta.value.slice(pos); ta.selectionStart = ta.selectionEnd = before.length; menu.hidden = true; renderCastChips();
  };
  ta.addEventListener("input", () => { AC_IDX = 0; show(); renderCastChips(); });
  ta.addEventListener("click", show);
  ta.addEventListener("blur", () => setTimeout(() => (menu.hidden = true), 150));
  ta.addEventListener("keydown", e => {
    if (menu.hidden) return;
    const n = menu.querySelectorAll(".ac-item").length;
    if (e.key === "ArrowDown") { AC_IDX = (AC_IDX + 1) % n; show(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { AC_IDX = (AC_IDX - 1 + n) % n; show(); e.preventDefault(); }
    else if (e.key === "Enter" || e.key === "Tab") { const it = menu.querySelectorAll(".ac-item")[AC_IDX]; if (it) { pick(it.dataset.h); e.preventDefault(); } }
    else if (e.key === "Escape") menu.hidden = true;
  });
}
init();
</script>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midea Studio</title>
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="icon" href="/ds/midea-mark.svg" type="image/svg+xml">
<style>
/* palette = design-system tokens (docs/design-system/tokens.css) */
:root{--bg:var(--ground);--panel:var(--surface);--panel2:var(--surface-raised);--fg:var(--ink);--muted:var(--ink-subtle);--accent:var(--amber);--accent2:var(--amber-text);--ok:var(--rank-up);--warn:var(--amber);--bad:var(--rank-down);--r:14px}
:root{--bg-legacy:#1a1e29;--fg:#eef0f6;--muted:#7d849a;--accent:#f5a524;--accent2:#8b90c8;--ok:#3fb984;--warn:#f5a524;--bad:#e5534b;--r:4px}
:root{color-scheme:dark}a{color:var(--accent);text-decoration:none}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font-sans,system-ui),"Noto Sans TC","PingFang TC",sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-amber);font-weight:700}
button.danger{border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
textarea{resize:vertical}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
.app{display:grid;grid-template-columns:340px 1fr;height:100vh}
aside{border-right:1px solid var(--line);overflow:auto;padding:16px;background:var(--panel)}
main{overflow:auto;padding:20px 24px 80px}
h1{font-size:18px;margin:0 0 12px;display:flex;align-items:center;gap:8px}h1 small{color:var(--muted);font-weight:400;font-size:12px}
h2{font-size:14px;font-weight:500;margin:22px 0 10px;display:flex;align-items:center;gap:8px}h2::before{content:'';width:3px;height:13px;background:var(--accent);display:inline-block}h3{font-size:12px;margin:0 0 8px;color:var(--fg);font-weight:500;letter-spacing:.04em;display:flex;align-items:center;gap:8px}h3::before{content:'';width:3px;height:12px;background:var(--accent);display:inline-block}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.chk{display:flex;gap:6px;align-items:center;margin-top:8px;color:var(--fg);font-size:13px}.chk input{width:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.plist{margin-top:16px;display:flex;flex-direction:column;gap:6px}
.pitem{padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer}.pitem:hover{background:var(--panel2)}.pitem.on{border-color:var(--accent);background:var(--panel2)}
.pitem .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pitem .m{color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:1px 8px;border-radius:2px;font-size:11px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.b-pass,.b-done,.b-approved{color:var(--ok);border-color:var(--ok)}.b-warn,.b-awaiting,.b-awaiting_approval,.b-review{color:var(--warn);border-color:var(--warn)}
.b-fail,.b-failed,.b-rejected,.b-qa_failed{color:var(--bad);border-color:var(--bad)}.b-running{color:var(--accent);border-color:var(--accent)}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}.stage{padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.stage{border-radius:2px;background:var(--panel)}.stage.done{color:var(--fg);border-color:var(--accent2);background:#8b90c822}.stage.cur{color:#1a1e29;background:var(--accent);border-color:var(--accent)}.stage.gate::after{content:" ◆";color:var(--warn)}
.gatebar{position:sticky;top:0;z-index:5;background:#2a2a2a;background:linear-gradient(90deg,#3b3020,#262b3a);border:1px solid #f5a52466;border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;margin-bottom:16px}
.gatebar .row{flex-wrap:wrap}.gatebar textarea{min-height:38px;height:38px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.scene{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.scene .media{aspect-ratio:16/9;background:#000;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.scene{border-radius:4px}.scene .media img,.scene .media video{width:100%;height:100%;object-fit:contain}
.scene .media .k{position:absolute;left:8px;top:8px}.scene .media .d{position:absolute;right:8px;top:8px}
.scene .body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.scene .nar{font-size:13px}.scene .vis{font-size:12px;color:var(--muted);word-break:break-word}
.scene.sel{outline:2px solid var(--warn)}.scene textarea{font-size:12px;min-height:54px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:13px}.kv div:nth-child(odd){color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:500}
.cost{display:flex;gap:22px;flex-wrap:nowrap;align-items:center}.cost .n{font-size:26px;font-weight:300;letter-spacing:.02em}.cost .n .amber{color:var(--accent)}.cost .l{color:var(--muted);font-size:12px}
.log{font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--muted);max-height:220px;overflow:auto;background:var(--bg);border-radius:8px;padding:8px;border:1px solid var(--line)}
.vram{height:6px;background:var(--line);overflow:hidden}.vram i{display:block;height:100%;background:var(--accent)}
.svc{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;color:var(--muted)}.svc b{color:var(--fg);font-weight:500}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#444;margin-right:6px}.dot.on{background:var(--ok)}
pre.json{white-space:pre-wrap;font:12px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--line);max-height:420px;overflow:auto}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 12px}.tab{padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent}.tab.on{color:var(--fg);border-color:var(--accent)}.ring{display:flex;align-items:center;gap:10px}.ring svg{flex:0 0 auto}
.empty{color:var(--muted);text-align:center;padding:80px 20px}
.alts{display:flex;gap:4px;flex-wrap:wrap}.alts button{font-size:11px;padding:2px 6px}
.nav{display:flex;gap:4px;margin:-4px 0 12px}.nav button{flex:1;border-radius:2px}.nav button.on{border-color:var(--accent);color:var(--accent)}
.ac-wrap{position:relative}.ac-menu{position:absolute;left:0;right:0;top:100%;z-index:30;background:var(--panel2);border:1px solid var(--line);border-radius:6px;margin-top:2px;max-height:240px;overflow:auto;box-shadow:0 8px 24px #0008}
.ac-item{display:flex;gap:8px;align-items:center;padding:6px 8px;cursor:pointer;font-size:13px}.ac-item.on,.ac-item:hover{background:#f5a52422}.ac-item small{color:var(--muted)}
.av{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--line);flex:0 0 auto;display:inline-block}.av.lg{width:40px;height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px 2px 2px;border:1px solid var(--line);border-radius:99px;font-size:12px;background:var(--panel2);cursor:pointer}.chip:hover{border-color:var(--accent)}.chip .av{width:22px;height:22px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.acard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;display:flex;flex-direction:column}.acard:hover{border-color:var(--accent)}
.acard .ph{aspect-ratio:3/4;background:#11141c center/cover no-repeat;position:relative}.acard .ph .badge{position:absolute;left:8px;top:8px;background:#1a1e29cc}
.acard .bd{padding:10px 12px}.acard .nm{font-size:15px}.acard .hd{color:var(--accent);font-size:12px}.acard .mt{color:var(--muted);font-size:12px}
.acard.new{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);min-height:280px;font-size:14px}
.profile{display:grid;grid-template-columns:300px 1fr;gap:20px}.profile .hero{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:var(--r);background:#11141c;border:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}.gallery .g{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.gallery .g.on{border-color:var(--accent)}.gallery img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#11141c}.gallery .g .row{padding:6px 8px;font-size:12px;gap:4px}
.gallery .g button{font-size:11px;padding:2px 6px}
.films{display:flex;flex-direction:column;gap:10px}.film{display:grid;grid-template-columns:200px 1fr;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer}.film:hover{border-color:var(--accent)}
.film img.t{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:#000}.film .sc{display:flex;gap:4px;margin-top:6px;overflow:auto}.film .sc img{height:44px;border-radius:2px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.fgrid .full{grid-column:1/-1}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--accent);border-right-color:transparent;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-1px}@keyframes sp{to{transform:rotate(360deg)}}
.consent{border:1px solid #f5a52466;background:#f5a52411;border-radius:var(--r);padding:10px 12px;margin-top:12px}
.scene .cast{position:absolute;left:8px;bottom:8px;display:flex;gap:-4px}.scene .cast .av{width:26px;height:26px;border:2px solid #1a1e29;margin-right:-6px}
@media (max-width:900px){.profile{grid-template-columns:1fr}.film{grid-template-columns:1fr}.fgrid{grid-template-columns:1fr}}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr);height:auto;min-height:100vh}aside{border-right:0;border-bottom:1px solid var(--line);max-height:none;overflow:visible;min-width:0}main{overflow:visible;min-width:0;padding:16px 16px 80px}.kv{grid-template-columns:110px 1fr}.fb{grid-template-columns:1fr}.grid{grid-template-columns:1fr!important}.rv .card{grid-template-columns:1fr}.gpu-card{display:none}.roster{grid-template-columns:1fr 1fr;gap:10px}h1{flex-wrap:wrap}body[data-view]:not([data-view=films]) aside .card,body[data-view]:not([data-view=films]) .plist{display:none}}
.me{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-4px 0 12px;font-size:13px;color:var(--muted)}.me b{color:var(--fg)}
.fb{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.fb .card{display:flex;flex-direction:column;gap:8px}
.fb img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--bg)}.stat{display:flex;gap:16px;flex-wrap:wrap}.stat div{display:flex;flex-direction:column}.stat b{font-size:20px;font-weight:800}.stat span{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}.bar i{display:block;height:100%}
.nav{flex-wrap:wrap}.nav button{flex:1 1 28%;white-space:nowrap;padding:6px 8px}
.rv{display:flex;flex-direction:column;gap:10px}.rv .card{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.rv .acts{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="app">
<aside>
  <h1>Midea Studio <small id="mode"></small></h1>
  <div class="me" id="me"></div>
  <div class="nav"><button id="nav-films" class="on" onclick="goFilms()">影片製作</button><button id="nav-actors" onclick="goActors()">演員陣容 <span id="actor-count" style="color:var(--muted)"></span></button><button id="nav-ads" onclick="goAds()">廣告製作</button><button id="nav-fb" onclick="goFeedback()">觀眾回饋</button><button id="nav-rv" onclick="goReview()" hidden>審核 <span id="rv-count" style="color:var(--muted)"></span></button></div>
  <div class="card">
    <h3>新影片</h3>
    <label>一句話描述</label>
    <div class="ac-wrap"><textarea id="f-prompt" rows="3" placeholder="製作一支 60 秒解釋神經網路的動畫；輸入 @ 指定演員"></textarea><div class="ac-menu" id="ac-menu" hidden></div></div>
    <div class="chips" id="f-cast"></div>
    <div class="row">
      <div><label>製作管線</label><select id="f-pipe"><option value="auto">自動判斷</option></select></div>
      <div style="flex:.6"><label>秒數</label><input id="f-dur" type="number" value="60" min="5" max="600"></div>
    </div>
    <div class="row">
      <div><label>畫面比例</label><select id="f-aspect"><option value="">依管線</option><option>16:9</option><option>9:16</option><option>1:1</option><option>4:5</option><option>21:9</option></select></div>
      <div><label>語言</label><select id="f-lang"><option value="zh-TW">繁中</option><option value="zh-CN">简中</option><option value="en">English</option><option value="ja">日本語</option></select></div>
    </div>
    <label>參考影片（Shorts / Reels / TikTok）</label>
    <input id="f-ref" placeholder="https://youtube.com/shorts/…">
    <label>旁白聲音（VoxCPM2 聲音設計描述）</label>
    <input id="f-voice" placeholder="(warm, clear documentary narrator)">
    <label>自有素材（長片、配音來源、產品參考圖）</label>
    <input id="f-media" type="file" multiple>
    <label class="chk"><input type="checkbox" id="f-real"> 僅使用真實素材（Archive.org / NASA / Wikimedia / Pexels）</label>
    <label class="chk"><input type="checkbox" id="f-music" checked> 背景音樂（ACE-Step）</label>
    <label class="chk"><input type="checkbox" id="f-subs" checked> 字幕壓製</label>
    <label class="chk" id="f-auto-wrap"><input type="checkbox" id="f-auto"> 自動通過所有關卡（不建議）</label>
    <div style="margin-top:12px"><button class="primary" id="f-go" style="width:100%">開始製作</button></div>
  </div>
  <div class="card gpu-card" style="margin-top:12px">
    <h3>GPU</h3>
    <div id="gpu"></div>
  </div>
  <div class="plist" id="plist"></div>
</aside>
<main id="main"><div class="empty">選擇左側專案，或輸入一句話開始製作。<br><br><span id="toolcount"></span></div></main>
</div>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const BASE = location.pathname.startsWith("/studio") ? "/studio" : "";
const HDR = { "X-Midea": "1" };
const errText = async r => { const t = await r.text(); try { const j = JSON.parse(t); return j.detail || t; } catch (e) { return t; } };
const api = async (u, o = {}) => { const r = await fetch(BASE + u, { ...o, headers: { "Content-Type": "application/json", ...HDR, ...(o.headers || {}) } }); if (r.status === 401 && BASE) { location.href = "/?signin=studio"; throw new Error("請先登入"); } if (!r.ok) throw new Error(await errText(r)); return r.json(); };
let META = {}, CUR = null, DATA = null, ES = null, TAB = "board", SEL = new Set(), REGEN = {};
let ACTORS = [], VIEW = "films", ACTOR = null, ACTOR_POLL = null, DRAFT = null, AC_IDX = 0;
const actorUrl = (id, p) => p ? `${BASE}/actor-files/${id}/${p}`.replace(/#/g, "%23") : "";
const GENDER_ZH = { female: "女", male: "男", nonbinary: "非二元" };
const STATUS_ZH = { done: "完成", running: "製作中", awaiting_approval: "待核准", failed: "失敗", qa_failed: "QA 未過", created: "建立" };
const STAGE_ZH = { reference_analysis: "參考分析", proposal: "企劃", script: "腳本", scene_plan: "分鏡", voice: "旁白", assets: "素材生成", music_sfx: "音樂音效", edit: "剪輯", compose: "合成字幕", qa: "自我審核", publish: "發佈", ingest: "匯入", transcribe: "轉錄", highlights: "高光", translate: "翻譯", product: "商品解析", tryon: "商品定裝", concepts: "創意提案", copy: "文案腳本", storyboard: "鏡頭分鏡", versions: "多版本輸出" };
const KIND_ZH = { h3_t2v: "H3 生成", h3_i2v: "H3 圖生影", h3_r2v: "H3 參考", stock_video: "真實影片", stock_image: "真實照片", motion: "動態圖形", title_card: "標題卡", user_media: "自有素材" };
const LIST_ZH = { pending: "上架審核中", approved: "已上架", rejected: "未通過上架" }, LIST_B = { pending: "awaiting", approved: "approved", rejected: "rejected" };
const fileUrl = p => `${BASE}/files/${CUR}/${p}`.replace(/#/g, "%23");

async function init() {
  META = await api("/api/meta");
  $("#mode").textContent = META.mode === "mock" ? "MOCK（無 GPU 示範）" : "LOCAL GPU";
  const me = META.me || {};
  $("#me").innerHTML = META.auth === "cafeca" ? `<b>${esc(me.name)}</b>${me.admin ? ` <span class="badge b-approved">管理者</span>` : ""}
    <a href="/">公開網站</a> · <a href="#" onclick="logout();return false">登出</a>` : `<b>本機操作者</b>`;
  if (me.admin) { $("#nav-rv").hidden = false; refreshReviewCount(); } else if (META.auth === "cafeca") $("#f-auto-wrap").hidden = true;
  $("#toolcount").textContent = `${Object.keys(META.pipelines).length} 條製作管線 · ${META.tools} 種工具`;
  for (const [k, p] of Object.entries(META.pipelines)) $("#f-pipe").insertAdjacentHTML("beforeend", `<option value="${k}">${esc(p.title)}</option>`);
  $("#f-go").onclick = create;
  initMention();
  refreshList(); refreshGpu(); refreshActors(); setInterval(refreshGpu, 5000); setInterval(refreshList, 8000);
  const h = location.hash.slice(1);
  if (h === "feedback") goFeedback(); else if (h === "review") goReview(); else if (h === "ads") goAds(); else if (h === "actors") goActors(); else if (h.startsWith("actor/")) openActor(h.slice(6)); else if (h) open(h);
  window.addEventListener("hashchange", () => {
    const k = location.hash.slice(1);
    if (k === "feedback") { if (VIEW !== "feedback") goFeedback(); }
    else if (k === "review") { if (VIEW !== "review") goReview(); }
    else if (k === "ads") { if (VIEW !== "ads") goAds(); }
    else if (k === "actors" && VIEW !== "actors") goActors();
    else if (k.startsWith("actor/") && ACTOR?.id !== k.slice(6)) openActor(k.slice(6));
    else if (k && !k.startsWith("actor") && !["feedback", "review"].includes(k) && (k !== CUR || VIEW !== "films")) open(k);
  });
}
async function refreshList() {
  const ps = await api("/api/projects");
  $("#plist").innerHTML = ps.map(p => `<div class="pitem ${p.id === CUR ? "on" : ""}" onclick="open('${p.id}')"><div class="t">${esc(p.title || p.id)}</div>
    <div class="m"><span class="badge b-${p.status}">${STATUS_ZH[p.status] || p.status}</span> ${p.listing ? `<span class="badge b-${LIST_B[p.listing] || ""}">${LIST_ZH[p.listing] || p.listing}</span> ` : ""}${esc(META.pipelines[p.pipeline]?.title || p.pipeline)} · ${esc(STAGE_ZH[p.stage] || p.stage || "")}${META.me?.admin && p.owner ? ` · <span title="${esc(p.owner)}">${esc(p.owner.slice(0, 8))}…</span>` : ""}</div></div>`).join("") || `<div class="m" style="color:var(--muted);padding:8px">還沒有影片。在上方寫一句話開始製作。</div>`;
}
async function refreshGpu() {
  try {
    const g = await api("/api/gpu"); const pct = Math.min(100, g.resident_gb / g.budget_gb * 100);
    const dev = g.gpus[0] ? `${esc(g.gpus[0].name)} · ${(g.gpus[0].used_mb / 1024).toFixed(1)}/${(g.gpus[0].total_mb / 1024).toFixed(0)} GB · ${g.gpus[0].util}%` : "未偵測到 nvidia-smi";
    $("#gpu").innerHTML = `<div class="svc"><span>${dev}</span></div><div class="vram"><i style="width:${pct}%"></i></div>
      <div class="svc"><span>Midea 配置 ${g.resident_gb.toFixed(1)} / ${g.budget_gb.toFixed(1)} GB</span></div>` +
      (g.foreign_gb ? `<div class="svc" title="${esc((g.foreign || []).map(a => a.pid + " " + a.name).join(", "))}"><span style="color:var(--bad)">其他程式占用 ${g.foreign_gb} GB</span></div>` : "") +
      Object.entries(g.services).map(([n, s]) => `<div class="svc"><span><span class="dot ${s.running ? "on" : ""}"></span><b>${n}</b> ${esc(s.model || "")}</span>

async function uploadActorFiles(id, prefix) {
  const photo = $(`#${prefix}-photo`)?.files[0], voice = $(`#${prefix}-voice`)?.files[0];
  if (!photo && !voice) return null;
  if (!$(`#${prefix}-consent`).checked) throw new Error("上傳真人照片或聲音前，請先勾選授權聲明");
  let last = null;
  for (const [kind, f] of [["portrait", photo], ["voice", voice]]) {
    if (!f) continue;
    const fd = new FormData(); fd.append("kind", kind); fd.append("consent", "true"); fd.append("note", $(`#${prefix}-note`).value); fd.append("file", f);
    const r = await fetch(`${BASE}/api/actors/${id}/upload`, { method: "POST", body: fd, headers: HDR }); if (!r.ok) throw new Error(await r.text()); last = await r.json();
  }
  return last;
}

  body.generate = false;

  try {

      if (!$("#c-photo").files[0]) await api(`/api/actors/${a.id}/look`, { method: "POST", body: "{}" });
      if (!$("#c-voice").files[0]) await api(`/api/actors/${a.id}/voice`, { method: "POST", body: "{}" });
    }
    await refreshActors(); openActor(a.id);
  } catch (e) { alert(e.message); $("#c-save").disabled = false; }
}

function job(name) {
  const j = (ACTOR.jobs || {})[name]; if (!j) return "";
  if (j.status === "running") return `<span class="badge b-running"><span class="spin"></span> 生成中${j.total ? ` ${j.done || 0}/${j.total}` : ""}</span>`;
  if (j.status === "queued") return `<span class="badge b-awaiting">排隊中</span>`;
  if (j.status === "error") return `<span class="badge b-fail" title="${esc(j.error)}">失敗：${esc((j.error || "").slice(0, 60))}</span>`;
  return "";
}
const LANG_ZH = { "zh-TW": "繁中", "zh-CN": "简中", en: "English", ja: "日本語" };
function qaBadge(p) {
  const q = p?.qa || {}; if (!q.status || q.status === "skip") return "";
  const tip = [...(q.issues || []), ...(q.attempts?.length > 1 ? [`共生成 ${q.attempts.length} 次`] : [])].join("；");
  return q.status === "pass" ? `<span class="badge b-pass" title="${esc(tip || "自動驗收通過")}">✓ 驗收</span>`
    : `<span class="badge b-warn" title="${esc(tip)}">⚠ ${esc((q.issues || [])[0] || "未通過")}</span>`;
}
function renderActor() {
  const a = ACTOR, ap = a.appearance || {}, vo = a.voice || {}, it = a.intro || {}, st = a.stale || {};
  const by = {}; for (const p of a.portraits || []) { const v = ({ full_body: "full_front", profile: "full_side" })[p.view] || p.view; if (!by[v] || p.view === v) by[v] = p; }
  const ts = p => p ? `?t=${Math.round(p.at || 0)}` : "", films = a.films || [];
  const lookReady = a.look_views.every(v => by[v]), approved = a.look?.approved;
  const head = by.headshot || a.portraits?.[0];
  const busy = n => ["running", "queued"].includes(a.jobs?.[n]?.status);
  const hero = it.file ? `<video class="hero" src="${actorUrl(a.id, it.file)}" poster="${actorUrl(a.id, it.poster)}" controls playsinline preload="metadata"></video>`
    : head ? `<img class="hero" src="${actorUrl(a.id, head.file)}${ts(head)}">` : `<div class="hero" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">${job("look") || "尚無定妝照"}</div>`;
  const notices = [];
  if (a.look?.stale) notices.push(`外貌設定已修改，目前的照片與設定不符。<button onclick="genLook(false)">依新設定重拍長相</button>`);
  if (lookReady && !approved && !busy("look")) notices.push(`<b>定妝確認</b>：確認正面大頭照與正面全身照的長相後，才會展開側面 / 背面照並拍攝自我介紹影片。

function castIn(text) {
  const out = [];
  for (const m of (text || "").matchAll(/@([\w㐀-鿿぀-ヿ가-힯.\-]+)/g)) {
    let tok = m[1].toLowerCase(), a = null;
    while (tok && !(a = ACTORS.find(x => [x.handle, x.name, x.name_en, x.id].some(k => (k || "").toLowerCase().replace(/\s+/g, "_") === tok)))) tok = tok.slice(0, -1);
    if (a && !out.includes(a)) out.push(a);
  }
  return out;
}
function renderCastChips() {
  const el = $("#f-cast"); if (!el) return;
  el.innerHTML = castIn($("#f-prompt").value).map(a => `<span class="chip" onclick="openActor('${a.id}')" title="開啟演員頁"><img class="av" src="${actorUrl(a.id, a.thumb)}">${esc(a.name)}</span>`).join("");

function initMention() {
  const ta = $("#f-prompt"), menu = $("#ac-menu");
  const token = () => { const m = ta.value.slice(0, ta.selectionStart).match(/@([^\s@]*)$/); return m ? m[1] : null; };
  const show = () => {
    const q = token(); if (q === null || !ACTORS.length) return (menu.hidden = true);
    const ql = q.toLowerCase(), score = a => [a.handle, a.name, a.name_en].reduce((m, k) => { const t = (k || "").toLowerCase();
      return Math.min(m, t.startsWith(ql) ? 0 : t.includes(ql) ? 1 : 9); }, 9);
    const list = ACTORS.filter(a => !ql || score(a) < 9).sort((x, y) => score(x) - score(y)).slice(0, 8);
    if (!list.length) return (menu.hidden = true);
    AC_IDX = Math.min(AC_IDX, list.length - 1);
    menu.innerHTML = list.map((a, i) => `<div class="ac-item ${i === AC_IDX ? "on" : ""}" data-h="${esc(a.handle)}"><img class="av" src="${actorUrl(a.id, a.thumb)}">
      <div><div>${esc(a.name)} <span style="color:var(--accent)">@${esc(a.handle)}</span></div><small>${a.age} 歲 · ${GENDER_ZH[a.gender]}${a.occupation ? " · " + esc(a.occupation) : ""}</small></div></div>`).join("");
    menu.hidden = false;
    menu.querySelectorAll(".ac-item").forEach(it => it.onmousedown = e => { e.preventDefault(); pick(it.dataset.h); });
  };
  const pick = h => {
    const pos = ta.selectionStart, before = ta.value.slice(0, pos).replace(/@([^\s@]*)$/, "@" + h + " ");
    ta.value = before + ta.value.slice(pos); ta.selectionStart = ta.selectionEnd = before.length; menu.hidden = true; renderCastChips();
  };
  ta.addEventListener("input", () => { AC_IDX = 0; show(); renderCastChips(); });
  ta.addEventListener("click", show);
  ta.addEventListener("blur", () => setTimeout(() => (menu.hidden = true), 150));
  ta.addEventListener("keydown", e => {
    if (menu.hidden) return;
    const n = menu.querySelectorAll(".ac-item").length;
    if (e.key === "ArrowDown") { AC_IDX = (AC_IDX + 1) % n; show(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { AC_IDX = (AC_IDX - 1 + n) % n; show(); e.preventDefault(); }
    else if (e.key === "Enter" || e.key === "Tab") { const it = menu.querySelectorAll(".ac-item")[AC_IDX]; if (it) { pick(it.dataset.h); e.preventDefault(); } }
    else if (e.key === "Escape") menu.hidden = true;
  });
}

          價格：${pr.price?.display ? esc(pr.price.currency + " " + pr.price.value) : `<span style="color:var(--warn)">不使用（${esc(pr.price?.reason || "頁面無價格")}）</span>`}</div>
        <table><tr><th>#</th><th>事實</th><th>出處（原文）</th><th></th></tr>${(ft.facts || []).map(f => `<tr><td>${f.id}</td><td>${esc(f.fact_zh || f.fact)}</td>
          <td style="color:var(--muted);font-size:12px">${esc(f.source)}</td><td>${f.verified ? `<span class="badge b-pass">已核對</span>` : `<span class="badge b-warn">未核對</span>`}</td></tr>`).join("")}</table>
        ${(ft.unknown || []).length ? `<div style="font-size:12px;color:var(--muted);margin-top:6px">頁面沒有提供：${ft.unknown.map(esc).join("、")}（文案不會提到）</div>` : ""}</div></div>
      ${aw("product") ? jsonEditor("product", pr.fact_table, "編修商品事實表") : ""}</div>`;
  }
  const t = d.tryon;
  if (t && !t.skipped) {
    h += `<h2>商品定裝</h2><div class="gallery">${(t.views || []).map(v => `<div class="g ${SEL.has(v.view) ? "on" : ""}"><img src="${pf(v.file)}?v=${encodeURIComponent(v.file)}" onclick="window.open(this.src)">
      <div class="row" style="justify-content:space-between"><span>${({ full_front: "正面全身", headshot: "大頭照", full_side: "側面全身" })[v.view] || v.view}</span>
      ${qaBadge(v)}${aw("tryon") ? `<label class="chk" style="margin:0;flex:0 0 auto"><input type="checkbox" ${SEL.has(v.view) ? "checked" : ""} onchange="toggleSel('${v.view}',this.checked)">重畫</label>` : ""}</div></div>`).join("")}</div>
      ${aw("tryon") ? `<label>版型／穿法說明（重畫時套用）</label><input id="tryon-notes" value="${esc(t.notes || "")}" placeholder="例：長袖、袖子捲到手肘、衣襬塞進褲子">` : ""}`;
  } else if (t?.skipped) h += `<h2>商品定裝</h2><div class="card" style="color:var(--muted)">${esc(t.reason)}</div>`;
  const c = d.concepts;
  if (c?.concepts) {
    h += `<h2>創意提案 ${c.chosen ? `<span class="badge b-approved">已選 ${esc(c.chosen)}</span>` : ""}</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">${c.concepts.map(x => `
      <div class="scene ${c.chosen === x.id ? "sel" : ""}"><div class="media">${x.preview_file ? `<video src="${pf(x.preview_file)}" controls preload="metadata"></video>` : "預覽生成中…"}<span class="badge k">${esc(x.id)}</span></div>
      <div class="body"><b>${esc(x.name)}</b><div style="color:var(--accent)">「${esc(x.slogan)}」</div><div class="nar">${esc(x.idea)}</div>
        <div style="display:flex;gap:3px">${(x.palette || []).map(p => `<span title="${p}" style="flex:1;height:16px;background:${p};border-radius:2px"></span>`).join("")}</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:3px">${(x.mood || []).map(m => `<img src="${pf(m)}" style="width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:2px">`).join("")}</div>
        <div class="vis">${(x.keywords || []).map(esc).join(" · ")}<br>光線：${esc(x.lighting)}<br>配樂：${esc(x.music)}</div>
        ${aw("concepts") ? `<button class="primary" onclick="decide('concepts',true,{choose:'${x.id}',note:$('#g-note')?.value||''})">選這個方向</button>` : ""}</div></div>`).join("")}</div>`;
  }
  const cp = d.copy;
  if (cp?.headline !== undefined) {
    const tr = Object.values(cp.translations || {})[0] || {};
    const flags = cp.flags || [];
    h += `<h2>廣告文案與腳本大綱</h2><div class="card">
      ${flags.length ? `<div style="margin-bottom:10px">${flags.map(f => `<div style="color:${f.level === "error" ? "var(--bad)" : "var(--warn)"};font-size:13px">${f.level === "error" ? "✕" : "⚠"} ${esc(f.message)}</div>`).join("")}</div>` : `<div style="color:var(--ok);font-size:13px;margin-bottom:8px">✓ 宣稱檢查通過：所有宣稱都對得回商品事實表</div>`}
      <div class="kv"><div>主標</div><div><b>${esc(cp.headline)}</b> <span style="color:var(--muted)">${esc(tr[cp.headline] || "")}</span></div>
        <div>副標</div><div>${esc(cp.sub)} <span style="color:var(--muted)">${esc(tr[cp.sub] || "")}</span></div><div>CTA</div><div>${esc(cp.cta)}</div>
        <div>字卡</div><div>${(cp.supers || []).map(s => `<span class="badge">${esc(BEAT_ZH[s.beat] || s.beat)}</span> ${esc(s.text)}`).join("<br>")}</div>
        <div>社群貼文</div><div style="font-size:12px">${(cp.social || []).map(esc).join("<br>")}</div></div>
      <table style="margin-top:10px"><tr><th>段落</th><th>時間</th><th>目的</th><th>台詞</th></tr>${(cp.outline || []).map(b => `<tr><td>${esc(BEAT_ZH[b.beat] || b.beat)}</td><td>${b.start}–${b.end}s</td><td>${esc(b.purpose)}</td>
        <td>${(b.lines || []).map(l => `<b>${esc(l.speaker)}</b>：${esc(l.text)}<br><span style="color:var(--muted);font-size:12px">${esc(tr[l.text] || "")}</span>`).join("<br>")}</td></tr>`).join("")}</table>
      ${aw("copy") ? jsonEditor("copy", Object.fromEntries(Object.entries(cp).filter(([k]) => !["flags", "translations"].includes(k))), "編修文案") : ""}</div>`;
  }
  const sb = d.storyboard;
  if (sb?.shots) {
    const total = sb.shots.reduce((a, s) => a + s.duration, 0), castOf = id => (DATA.cast || []).find(x => x.id === id);
    h += `<h2>鏡頭語言與關鍵分鏡 <span class="badge">${sb.shots.length} 鏡 · ${total.toFixed(1)} 秒 · 商品出現 ${sb.product_seconds ?? "?"} 秒</span></h2>
      <div class="grid">${sb.shots.map(s => { const sel = SEL.has(s.id);
        return `<div class="scene ${sel ? "sel" : ""}"><div class="media">${s.keyframe ? `<img src="${pf(s.keyframe)}?v=${encodeURIComponent(s.keyframe)}" onclick="window.open(this.src)">` : (s.kind === "endcard" ? "商品定格片尾" : "分鏡繪製中…")}
          <span class="badge k">${esc(s.id)} · ${esc(BEAT_ZH[s.beat] || s.beat)}</span><span class="badge d">${s.duration.toFixed(1)}s</span>
          ${(s.actors || []).length ? `<span class="cast">${s.actors.map(castOf).filter(Boolean).map(x => `<img class="av" src="${actorUrl(x.id, x.thumb)}">`).join("")}</span>` : ""}</div>
          <div class="body"><div class="vis">${esc([s.shot_size, s.angle, s.movement, s.lens].filter(Boolean).join(" · "))}<br>${esc([s.lighting, s.color].filter(Boolean).join(" · "))} · 轉場 ${esc(s.transition || "cut")}${s.product_visible ? " · 🛍 商品入鏡" : ""}</div>
          ${s.line?.text ? `<div class="nar">🎙 ${esc(castOf(s.line.speaker)?.name || "旁白")}：${esc(s.line.text)}</div>` : ""}${s.super ? `<div class="vis">字卡：${esc(s.super)}</div>` : ""}
          <div class="vis" style="font-size:11px">${esc(s.prompt || "")}</div>
          ${aw("storyboard") && s.kind !== "endcard" ? `<label class="chk"><input type="checkbox" ${sel ? "checked" : ""} onchange="toggleSel('${s.id}',this.checked)"> 重畫這張分鏡</label>
            ${sel ? `<textarea placeholder="新的畫面描述（留空＝同描述換一張）" oninput="setRegen('${s.id}','prompt',this.value)">${esc(REGEN[s.id]?.prompt || "")}</textarea>` : ""}` : ""}</div></div>`; }).join("")}</div>`;
  }
  return h || `<div class="empty">正在解析商品頁…</div>`;
}
function jsonEditor(gate, data, title) {
  return `<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--muted)">${title}（JSON，修改後按上方「核准」生效）</summary>
    <textarea id="json-edit" data-gate="${gate}" rows="14" style="font:12px ui-monospace,Menlo,monospace;margin-top:6px" oninput="this.dataset.dirty=1">${esc(JSON.stringify(data, null, 2))}</textarea></details>`;
}
async function redrawShots() { const r = {}; for (const id of SEL) r[id] = REGEN[id] || {}; await decide("storyboard", false, { redraw: r }); }
async function redoTryon() { await decide("tryon", false, { redo: [...SEL], notes: $("#tryon-notes")?.value || "" }); }
function adFinal(list) {
  const outs = DATA.data.versions?.outputs || [], crops = DATA.data.versions?.crops || {};
  const label = x => { const m = /_(60s|15s)_(\d+x\d+)\./.exec(x.video || "") || []; return m[1] ? `${m[1].replace("s", " 秒")} · ${m[2].replace("x", ":")}` : "60 秒 · 16:9"; };
  const regen = Object.values(crops).filter(c => c.method === "regenerate").length;
  return `<div style="color:var(--muted);font-size:13px;margin-bottom:10px">9:16 直式：${regen} 鏡重新生成、其餘由 16:9 智慧裁切（裁切需保留人物且原始畫素 ≥ 480px）。</div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${list.map(x => `<div class="card"><b>${label(x)}</b>
    <video src="${fileUrl(x.video)}" controls preload="metadata" style="width:100%;max-height:52vh;background:#000;border-radius:6px;margin-top:6px"></video>
    <div class="row" style="margin-top:6px;justify-content:flex-start;gap:6px">${["video", "srt", "ass"].filter(k => x[k]).map(k => `<a href="${fileUrl(x[k])}" download><button style="font-size:12px">${k.toUpperCase()}</button></a>`).join("")}</div></div>`).join("")}</div>
    <div class="row" style="margin-top:12px;justify-content:flex-start;gap:8px">${[["final/storyboard.pdf", "分鏡表 PDF"], ["final/copy.md", "文案稿"], ["final/moodboard.jpg", "風格意象板"], ["final/README.md", "README / 出處"]].map(([f, t]) => `<a href="${fileUrl(f)}" target="_blank"><button>${t}</button></a>`).join("")}</div>`;
}
init();
</script>
</body>
</html>
